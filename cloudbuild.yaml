steps:
- name: 'gcr.io/cloud-builders/npm'
  args: ['install']
- name: 'gcr.io/cloud-builders/npm'
  args: ['test']
- name: 'alpine'
  entrypoint: 'sh'
  args:
  - -c
  - |
    apk add --no-cache zip > /dev/null 2>&1 || true
    mkdir -p dist
    zip -r dist/extension.zip . -x "node_modules/*" "test/*" ".git/*" "dist/*"
- name: 'gcr.io/cloud-builders/gsutil'
  args: ['cp','dist/extension.zip','gs://$PROJECT_ID-extensions/']
options:
  substitutionOption: ALLOW_LOOSE
substitutions:
  _BUCKET: ''
timeout: '1200s'
